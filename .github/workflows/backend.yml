name: Backend verification
on:
  push:
    paths: ['autoclipper-backend-microservices/**', 'autoclipper-infrastructure/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['autoclipper-backend-microservices/**', 'autoclipper-infrastructure/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autoclipper-backend-microservices
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: autoclipper-backend-microservices/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - run: npm run openapi:export && npm run client:types
      - name: Contracts must be committed and current
        run: git diff --exit-code -- ../autoclipper-project-documentation/contracts packages/autoclipper-api-contracts/src/generated.ts apps/autoclipper-api-gateway/contracts

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node autoclipper-infrastructure/setup-local.mjs
      - name: Build and run actual dependency tests
        working-directory: autoclipper-infrastructure
        run: docker compose --profile app --profile test run --build --rm verification
      - name: Show sanitized service diagnostics
        if: failure()
        working-directory: autoclipper-infrastructure
        run: docker compose ps
      - name: Stop ephemeral CI infrastructure
        if: always()
        working-directory: autoclipper-infrastructure
        run: docker compose --profile app --profile test down

  business:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node autoclipper-infrastructure/setup-local.mjs
      - name: Build application and verification images
        working-directory: autoclipper-infrastructure
        run: docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app build media business-verification
      - name: Test real accounts, permissions and uploads
        working-directory: autoclipper-infrastructure
        run: docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app run --rm business-verification
      - name: Verify persistent analysis with explicit test providers
        working-directory: autoclipper-infrastructure
        run: |
          docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app stop analysis
          docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app run --rm analysis-verification
      - name: Verify durable orchestration with explicit stage fixtures
        working-directory: autoclipper-infrastructure
        run: |
          docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app stop project
          docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app run --rm pipeline-verification
      - name: Show dependency state on failure
        if: failure()
        working-directory: autoclipper-infrastructure
        run: docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app ps --all
      - name: Stop ephemeral business infrastructure
        if: always()
        working-directory: autoclipper-infrastructure
        run: docker compose -f compose.yaml -f compose.business.yaml -f compose.business-tests.yaml --profile app down

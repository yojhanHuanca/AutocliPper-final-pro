name: autoclipper

x-media-environment: &media-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3001
  ENABLE_DOCS: 'true'
  CORS_ORIGIN: http://localhost:4200
  DATABASE_URL: postgresql://autoclipper_media_runtime:${MEDIA_RUNTIME_PASSWORD:?Run setup-local.mjs}@postgres:5432/autoclipper_media
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run setup-local.mjs}@redis:6379/0
  S3_ENDPOINT: http://storage:9000
  S3_BUCKET: autoclipper-media
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run setup-local.mjs}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Run setup-local.mjs}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run setup-local.mjs}
  TEMP_DIR: /tmp/media
  WORKER_CONCURRENCY: '2'

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: autoclipper_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup-local.mjs}
      MEDIA_OWNER_PASSWORD: ${MEDIA_OWNER_PASSWORD:?Run setup-local.mjs}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD:?Run setup-local.mjs}
      IDENTITY_OWNER_PASSWORD: ${IDENTITY_OWNER_PASSWORD:?Run setup-stage2.mjs}
      IDENTITY_RUNTIME_PASSWORD: ${IDENTITY_RUNTIME_PASSWORD:?Run setup-stage2.mjs}
      WORKSPACE_OWNER_PASSWORD: ${WORKSPACE_OWNER_PASSWORD:?Run setup-stage2.mjs}
      WORKSPACE_RUNTIME_PASSWORD: ${WORKSPACE_RUNTIME_PASSWORD:?Run setup-stage2.mjs}
      PROJECT_OWNER_PASSWORD: ${PROJECT_OWNER_PASSWORD:?Run setup-stage2.mjs}
      ANALYSIS_OWNER_PASSWORD: ${ANALYSIS_OWNER_PASSWORD:?Run setup-stage2.mjs}
      ANALYSIS_RUNTIME_PASSWORD: ${ANALYSIS_RUNTIME_PASSWORD:?Run setup-stage2.mjs}
      PROJECT_RUNTIME_PASSWORD: ${PROJECT_RUNTIME_PASSWORD:?Run setup-stage2.mjs}
    ports: ['127.0.0.1:15432:5432']
    volumes: ['postgres-data:/var/lib/postgresql', './postgres/init-media.sh:/docker-entrypoint-initdb.d/10-media.sh:ro','./postgres/init-business.sh:/docker-entrypoint-initdb.d/20-business.sh:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoclipper_bootstrap -d postgres']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  redis:
    image: redis:8.2.10-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup-local.mjs}
    command: ['/bin/sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 192mb --maxmemory-policy noeviction']
    ports: ['127.0.0.1:16379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Run setup-local.mjs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Run setup-local.mjs}
      RUSTFS_CONSOLE_ENABLE: 'false'
    command: ['/data']
    ports: ['127.0.0.1:19000:9000']
    volumes: ['storage-data:/data']
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped

  storage-init:
    profiles: ['app']
    image: autoclipper-backend:0.2.0
    build: &backend-build
      context: ../autoclipper-backend-microservices
      dockerfile: Dockerfile
      target: runtime
    environment: *media-environment
    command: ['node', 'scripts/storage-init.mjs']
    depends_on: [storage]
    restart: 'no'

  migrate-media:
    profiles: ['app']
    image: autoclipper-backend:0.2.0
    build: *backend-build
    environment:
      MIGRATION_DATABASE_URL: postgresql://autoclipper_media_owner:${MEDIA_OWNER_PASSWORD:?Run setup-local.mjs}@postgres:5432/autoclipper_media
    command: ['node', 'apps/autoclipper-media-processing-service/dist/infrastructure/migrate.js']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  renderer:
    profiles: ['app']
    image: autoclipper-backend:0.2.0
    build: *backend-build
    environment:
      <<: *media-environment
      PORT: 3005
      MEDIA_WORKERS: render
      TEMP_DIR: /tmp/render
    command: ['node','apps/autoclipper-media-processing-service/dist/main.js']
    depends_on:
      migrate-media: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3005/v1/health/ready',{signal:AbortSignal.timeout(10000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 12s
      retries: 6
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 96
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 210s
    restart: unless-stopped

  media:
    profiles: ['app']
    image: autoclipper-backend:0.2.0
    build: *backend-build
    environment: *media-environment
    command: ['node', 'apps/autoclipper-media-processing-service/dist/main.js']
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      migrate-media: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/v1/health/ready',{signal:AbortSignal.timeout(10000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 12s
      retries: 4
      start_period: 20s
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 96
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 90s
    restart: unless-stopped

  verification:
    profiles: ['test']
    image: autoclipper-verification:0.2.0
    build:
      context: ../autoclipper-backend-microservices
      dockerfile: Dockerfile
      target: verification
    environment:
      <<: *media-environment
      MIGRATION_DATABASE_URL: postgresql://autoclipper_media_owner:${MEDIA_OWNER_PASSWORD:?Run setup-local.mjs}@postgres:5432/autoclipper_media
      TEST_TEMP_DIR: /tmp/fixtures
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1

  gateway:
    profiles: ['app']
    image: autoclipper-backend:0.2.0
    build: *backend-build
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      ENABLE_DOCS: 'true'
      CORS_ORIGIN: http://localhost:4200
      COOKIE_AUTH: 'true'
      IDENTITY_URL: http://identity:3002
      WORKSPACE_URL: http://workspace:3003
      PROJECT_URL: http://project:3004
      BILLING_URL: http://billing:3007
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run setup-local.mjs}
    command: ['node', 'apps/autoclipper-api-gateway/dist/main.js']
    ports: ['127.0.0.1:3000:3000']
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:

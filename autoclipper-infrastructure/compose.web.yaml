services:
  web:
    profiles: ['app']
    image: autoclipper-web:0.1.0
    build:
      context: ../autoclipper-web-angular
      dockerfile: Dockerfile
      target: runtime
    environment:
      PORT: '4200'
      STATIC_ROOT: /app/browser
      PUBLIC_API_BASE_URL: http://localhost:3005/v1
    ports: ['127.0.0.1:4200:4200']
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:4200/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

# Opt-in local ASR. Download the verified 74.1 MiB model with setup-analysis-model.mjs first.
services:
  analysis:
    image: autoclipper-analysis-local:0.3.0
    build:
      context: ../autoclipper-backend-microservices
      dockerfile: Dockerfile
      target: analysis-local-runtime
    environment:
      WHISPER_PATH: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /models/ggml-tiny.bin
      WHISPER_MODEL_SHA256: be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      WHISPER_ENGINE_VERSION: 'v1.9.5-d1be6fde (CLI 1.9.5-dev)'
      WHISPER_MODEL: tiny
    volumes: ['../.local/models:/models:ro']
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 330s

<nav class="editor-rail panel" aria-label="Herramientas del editor">
  @for (item of vm.tabs; track item.id) {
    <button
      type="button"
      [class.active]="vm.tab() === item.id"
      [attr.aria-pressed]="vm.tab() === item.id"
      [attr.aria-label]="item.label"
      [title]="item.label"
      aria-controls="editor-inspector-panel"
      (click)="selectTab(item.id)"
    >
      <ac-icon [name]="item.icon" /><span>{{ item.label }}</span>
    </button>
  }
</nav>

<div class="depth-stage" role="img" aria-label="Composición ilustrativa: una grabación da lugar a tres posibles clips verticales">
  <div class="source-card">
    <div class="source-frame">
      <picture>
        <source srcset="/images/creator-480.webp 480w, /images/creator-960.webp 960w" sizes="(max-width: 700px) 90vw, 45vw" type="image/webp" />
        <img src="/images/creator-960.webp" width="960" height="640" alt="" fetchpriority="high" />
      </picture>
      <span class="source-badge">VIDEO ORIGINAL · 16:9</span>
      <strong>Un directo lleno de momentos.</strong>
    </div>
    <div class="source-footer">
      <span>grabación original</span>
      <div class="source-wave" aria-hidden="true">
        @for (bar of wave; track $index) { <i [style.height.%]="bar"></i> }
      </div>
      <span>48:12</span>
    </div>
  </div>

  <div class="cut-path" aria-hidden="true"></div>
  <div class="cut-icon" aria-hidden="true"><ac-icon name="scissors" /></div>

  <div class="clip-stack" aria-hidden="true">
    @for (clip of clips; track clip.time) {
      <div class="clip-card" [class]="'clip-card clip-' + $index">
        <img src="/images/creator-portrait-v1.webp" width="720" height="1279" alt="" [style.object-position-x]="clip.position" />
        <span class="clip-ratio">9:16</span>
        <strong>{{ clip.title }}</strong>
        <small>{{ clip.time }}</small>
      </div>
    }
  </div>
  <span class="stage-disclosure">Ejemplo visual · tú eliges el momento</span>
</div>
